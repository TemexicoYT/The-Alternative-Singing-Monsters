<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Alternative Singing Monsters</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
      color: white;
      font-family: sans-serif;
    }
    
    /* Loading Screen View */
    #loadingScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    #loadingScreen img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
    }
    #greenPlayBtn {
      margin-top: 20px;
      background-color: #28a745;
      color: white;
      font-size: 24px;
      font-weight: bold;
      padding: 15px 45px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }
    #greenPlayBtn:active {
      transform: scale(0.96);
    }

    /* Main Game Screen (Hidden until you tap Play) */
    #gameScreen {
      display: none;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #gameScreen img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
    }

    /* Fallback button in case browser still blocks audio */
    #unmuteBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: 2px solid white;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      display: none;
      z-index: 30;
    }
  </style>
</head>
<body>

  <!-- Loading Screen Overlay with Green Play Button -->
  <div id="loadingScreen">
    <img src="IMG_4820.jpeg" alt="The Alternative Singing Monsters Loading">
    <button id="greenPlayBtn" onclick="enterGame()">▶ PLAY GAME</button>
  </div>

  <!-- Main Game Screen showing IMG_4841.jpeg -->
  <div id="gameScreen">
    <img src="IMG_4841.jpeg" alt="The Alternative Singing Monsters Game">
    <button id="unmuteBtn" onclick="forcePlayAudio()">🔊 Tap for Sound</button>
  </div>

  <!-- Audio Player with preload and direct src -->
  <audio id="bgMusic" src="TheAlternativeSingingMonstersLoadingScreenMusic.m4a" preload="auto" loop playsinline></audio>

  <script>
    function enterGame() {
      const audio = document.getElementById('bgMusic');
      const loadingScreen = document.getElementById('loadingScreen');
      const gameScreen = document.getElementById('gameScreen');
      const unmuteBtn = document.getElementById('unmuteBtn');

      // Ensure volume is up and trigger playback directly inside the click event
      audio.volume = 1.0;
      const playPromise = audio.play();

      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.error("Audio playback error:", error);
          // Show a manual sound button if the browser blocked or failed to load the file
          unmuteBtn.style.display = 'block';
        });
      }

      // Hide the loading screen and reveal the game screen
      loadingScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
    }

    function forcePlayAudio() {
      const audio = document.getElementById('bgMusic');
      audio.load();
      audio.play().then(() => {
        document.getElementById('unmuteBtn').style.display = 'none';
      }).catch(err => {
        alert("Could not play audio. Make sure 'TheAlternativeSingingMonstersLoadingScreenMusic.m4a' is in the same folder as this HTML file.");
      });
    }
  </script>
</body>
</html>
