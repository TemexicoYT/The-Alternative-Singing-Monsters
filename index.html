<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Alternative Singing Monsters</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }

    #loadingScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000;
      z-index: 20;
    }

    #loadingScreen img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
    }

    #greenPlayBtn {
      margin-top: 20px;
      background-color: #28a745;
      color: white;
      font-size: 24px;
      font-weight: bold;
      padding: 15px 45px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    #gameScreen {
      display: none;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
    }

    /* Wraps tightly around the exact boundaries of IMG_4841.jpeg */
    #imageWrapper {
      position: relative;
      display: inline-block;
      line-height: 0;
    }

    #mainBg {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      display: block;
      user-select: none;
    }

    /* 1. Hitbox moved to the upper-right corner (purple thing area) */
    #woodEggHotspot {
      position: absolute;
      top: 10%;
      left: 82%;
      width: 10%;
      height: 12%;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;

      /* TEMPORARY RED GUIDE */
      border: 2px solid red;
      background: rgba(255, 0, 0, 0.3);
    }

    /* 2. Locked Popup Overlay (cannot be exited) */
    #eggModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 40;
    }

    /* Wraps tightly around the popup image so the center circle stays dead-center */
    #modalImageWrapper {
      position: relative;
      display: inline-block;
      line-height: 0;
    }

    #modalImg {
      max-width: 90vw;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255,255,255,0.2);
      display: block;
      user-select: none;
    }

    /* 3. Center Red Circle on the popup images */
    #centerClickHotspot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 18%;
      height: 22%;
      border-radius: 50%;
      cursor: pointer;
      z-index: 50;

      /* TEMPORARY RED GUIDE */
      border: 2px solid red;
      background: rgba(255, 0, 0, 0.3);
    }

    #unmuteBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: none;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 2px solid white;
      border-radius: 25px;
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
      z-index: 30;
    }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <img src="./IMG_4820.jpeg" alt="Loading screen">
    <button id="greenPlayBtn" onclick="enterGame()">▶ PLAY GAME</button>
  </div>

  <div id="gameScreen">
    <div id="imageWrapper">
      <img id="mainBg" src="./IMG_4841.jpeg" alt="Game screen">
      <div id="woodEggHotspot" onclick="openWoodEgg()"></div>
    </div>
    <button id="unmuteBtn" onclick="forcePlayAudio()">🔊 Tap for Sound</button>
  </div>

  <!-- Locked Modal (No close button, clicking background does nothing) -->
  <div id="eggModal">
    <div id="modalImageWrapper">
      <img id="modalImg" src="./IMG_4846.jpeg" alt="Sequence View">
      <!-- Clicking this center red circle advances through 4846 -> 4847 -> 4848 -> 4849 -> 4850 -->
      <div id="centerClickHotspot" onclick="nextModalImage()"></div>
    </div>
  </div>

  <audio id="bgMusic" src="./TheAlternativeSingingMonstersLoadingScreenMusic.m4a" preload="auto" loop playsinline></audio>

  <script>
    const audio = document.getElementById('bgMusic');

    // Sequence of images to step through
    const imageSequence = [
      './IMG_4846.jpeg',
      './IMG_4847.jpeg',
      './IMG_4848.jpeg',
      './IMG_4849.jpeg',
      './IMG_4850.jpeg'
    ];
    let currentImageIndex = 0;

    function enterGame() {
      const loadingScreen = document.getElementById('loadingScreen');
      const gameScreen = document.getElementById('gameScreen');
      const unmuteBtn = document.getElementById('unmuteBtn');

      audio.volume = 1.0;
      audio.play().catch(err => {
        console.log("Audio blocked:", err);
        unmuteBtn.style.display = 'block';
      });

      loadingScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
    }

    function forcePlayAudio() {
      audio.load();
      audio.play().then(() => {
        document.getElementById('unmuteBtn').style.display = 'none';
      }).catch(err => {
        alert("Could not play audio. Make sure 'TheAlternativeSingingMonstersLoadingScreenMusic.m4a' is in the same folder as this HTML file.");
      });
    }

    function openWoodEgg() {
      currentImageIndex = 0;
      document.getElementById('modalImg').src = imageSequence[currentImageIndex];
      document.getElementById('eggModal').style.display = 'flex';
    }

    function nextModalImage() {
      if (currentImageIndex < imageSequence.length - 1) {
        currentImageIndex++;
        document.getElementById('modalImg').src = imageSequence[currentImageIndex];
      }
    }

    // HELPER: Click anywhere on the background to get the exact top% and left% in your console (F12)
    document.getElementById('mainBg').addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      const leftPercent = (((e.clientX - rect.left) / rect.width) * 100).toFixed(1);
      const topPercent = (((e.clientY - rect.top) / rect.height) * 100).toFixed(1);
      console.log(`Clicked at -> top: ${topPercent}%; left: ${leftPercent}%;`);
    });
  </script>
</body>
</html>
